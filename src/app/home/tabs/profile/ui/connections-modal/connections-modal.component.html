<ion-item lines="full">
  <ion-label class="ion-text-center">
    <h2>{{ connection }}</h2>
  </ion-label>
</ion-item>
<ion-content>
  @for (user of connections; track user.username) {
    <ion-item lines="full" (click)="router.navigate(['/home/profiles/' + user.username])">
      <ion-label>
        <h3>{{ user.username }}</h3>
        <p>{{ user.firstName }} {{ user.lastName }}</p>
      </ion-label>
    </ion-item>
  }
</ion-content>
